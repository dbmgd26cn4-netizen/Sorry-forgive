<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Pookie Bear 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  font-family: 'Poppins', sans-serif;
  text-align: center;
  overflow: hidden;
  color: white;
}

/* REEL INTRO SCREEN */
.intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5em;
  color: white;
  z-index: 10;
  animation: fadeOut 3s forwards;
}

@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* glowing name */
.glow-name {
  font-size: 2.8em;
  margin-top: 120px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {
    text-shadow: 0 0 10px #fff, 0 0 20px #ff4d6d;
  }
  to {
    text-shadow: 0 0 20px #fff, 0 0 40px #ff4d6d;
  }
}

/* apology text */
.text {
  font-size: 1.5em;
  margin-top: 10px;
  animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* buttons */
button {
  font-size: 1.3em;
  padding: 12px 25px;
  margin: 12px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
}

.yes-btn {
  background: linear-gradient(45deg, #00ff87, #60efff);
  color: black;
}

.no-btn {
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
}
.pic {
  width: 220px;
  border-radius: 20px;
  margin-top: 20px;
  box-shadow: 0 0 25px rgba(255,255,255,0.7);
}
/* message */
#message {
  margin-top: 20px;
  font-size: 1.6em;
  text-shadow: 0 0 10px rgba(255,255,255,0.7);
}

/* floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- REEL INTRO -->
<div class="intro">💔 Please wait...</div>

<!-- MAIN CONTENT -->
<h1 class="glow-name">Pookie Bear 💖</h1>
<div class="text">I’m really sorry 🥺❤️<br>please forgive me</div>
<img src="IMG_3632.jpeg" class="pic">
<button class="yes-btn" onclick="sayYes()">Forgive Me ❤️</button>
<button class="no-btn" onmouseover="moveButton()">Still Angry 😢</button>

<p id="message"></p>

<script>
// move NO button
function moveButton() {
  const button = document.querySelector('.no-btn');
  const x = Math.random() * window.innerWidth * 0.8;
  const y = Math.random() * window.innerHeight * 0.8;
  button.style.left = `${x}px`;
  button.style.top = `${y}px`;
}

// YES click
function sayYes() {
  document.getElementById("message").innerText =
    "It won’t happen again Pookie Bear 🥺❤️ I love you 😘";

  for (let i = 0; i < 40; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }
}
</script>

</body>
</html>
