<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Pookie Bear 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  color: white;
}

/* intro */
.intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5em;
  z-index: 10;
  animation: fadeOut 3s forwards;
}

@keyframes fadeOut {
  0% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* text */
.glow-name {
  font-size: 2.8em;
  margin-top: 120px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff, 0 0 20px #ff4d6d; }
  to { text-shadow: 0 0 20px #fff, 0 0 40px #ff4d6d; }
}

.text {
  font-size: 1.5em;
}

/* images */
.pic {
  width: 220px;
  border-radius: 20px;
  margin-top: 20px;
  box-shadow: 0 0 25px rgba(255,255,255,0.7);
  pointer-events: none;
}

/* buttons */
button {
  font-size: 1.3em;
  padding: 12px 25px;
  margin: 12px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  position: relative;
  z-index: 5;
}

.yes-btn {
  background: linear-gradient(45deg, #00ff87, #60efff);
  color: black;
}

.no-btn {
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
}

/* message */
#message {
  margin-top: 20px;
  font-size: 1.6em;
}

/* hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* confetti */
@keyframes fall {
  from { transform: translateY(-10vh); }
  to { transform: translateY(100vh); }
}

/* LOVE SCREEN */
#loveScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 3em;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: 1s;
}

#loveScreen.show {
  opacity: 1;
  visibility: visible;
  animation: zoomIn 1s ease;
}

@keyframes zoomIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="intro">💔 Please wait...</div>

<h1 class="glow-name">Pookie Bear 💖</h1>

<div class="text">
  I’m really sorry 🥺❤️<br>please forgive me
</div>

<!-- FIRST IMAGE -->
<img id="firstImage" src="IMG_3632.jpeg" class="pic">

<!-- SECOND IMAGE -->
<img id="secondImage" src="IMG_3673.jpeg" class="pic" style="display: none;">

<br>

<button class="yes-btn" onclick="sayYes()">Forgive Me ❤️</button>
<button class="no-btn" onmouseover="moveButton()">Still Angry 😢</button>

<p id="message"></p>

<!-- FULL SCREEN LOVE -->
<div id="loveScreen">
  I LOVE YOU 💖<br>Pookie Bear 🥺
</div>

<script>
function moveButton() {
  const button = document.querySelector('.no-btn');
  const x = Math.random() * window.innerWidth * 0.8;
  const y = Math.random() * window.innerHeight * 0.8;
  button.style.left = `${x}px`;
  button.style.top = `${y}px`;
}

function sayYes() {
  document.getElementById("message").innerText =
    "It won’t happen again Pookie Bear 🥺❤️ I love you 😘";

  // switch images
  document.getElementById("firstImage").style.display = "none";
  document.getElementById("secondImage").style.display = "block";

  // background change
  document.body.style.background = "linear-gradient(135deg, #ff9a9e, #fad0c4)";

  // hearts
  for (let i = 0; i < 40; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }

  // confetti
  for (let i = 0; i < 30; i++) {
    let c = document.createElement("div");
    c.innerHTML = "✨";
    c.style.position = "absolute";
    c.style.left = Math.random() * 100 + "vw";
    c.style.top = "0";
    c.style.animation = "fall 3s linear";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }

  // show love screen
  setTimeout(() => {
    document.getElementById("loveScreen").classList.add("show");
  }, 2000);
}
</script>

</body>
</html>
