<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorry 💔</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  font-family: 'Poppins', sans-serif;
  text-align: center;
  overflow: hidden;
  color: white;
}

/* aesthetic glow text */
h1 {
  margin-top: 120px;
  font-size: 2.2em;
  text-shadow: 0 0 10px rgba(255,255,255,0.7);
}

/* buttons */
button {
  font-size: 1.3em;
  padding: 12px 25px;
  margin: 12px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
}

.yes-btn {
  background: linear-gradient(45deg, #00ff87, #60efff);
  color: black;
}

.no-btn {
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
}

/* message */
#message {
  margin-top: 20px;
  font-size: 1.6em;
  text-shadow: 0 0 8px rgba(255,255,255,0.6);
}

/* floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* glowing circle bg */
.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  filter: blur(100px);
  top: 20%;
  left: 30%;
}
</style>
</head>

<body>

<div class="glow"></div>

<h1 id="typing"></h1>

<button class="yes-btn" onclick="sayYes()">Forgive Me ❤️</button>
<button class="no-btn" onmouseover="moveButton()">Still Angry 😢</button>

<p id="message"></p>

<script>
const text = "Pookie Bear... I’m really sorry 🥺❤️ please forgive me";
let i = 0;

// typing effect
function typeEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeEffect, 50);
  }
}
typeEffect();

// moving NO button
function moveButton() {
  const button = document.querySelector('.no-btn');
  const x = Math.random() * window.innerWidth * 0.8;
  const y = Math.random() * window.innerHeight * 0.8;
  button.style.left = `${x}px`;
  button.style.top = `${y}px`;
}

// YES click
function sayYes() {
  document.getElementById("message").innerText =
    "I love you Pookie Bear 🥺❤️ "It won’t happen again Pookie Bear 🥺❤️ I love you 😘";

  for (let i = 0; i < 25; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }
}
</script>

</body>
</html>
